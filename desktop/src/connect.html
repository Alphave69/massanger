<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Nuntius — подключение</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <img class="logo" src="icon.png" alt="" />
      <h1>Nuntius</h1>
      <p id="lead">Впиши адрес своего сервера Nuntius</p>
      <form id="form">
        <input id="url" placeholder="https://nuntius.ru" autocomplete="url" spellcheck="false" autofocus />
        <div class="error" id="error"></div>
        <button id="go" type="submit">Подключиться</button>
        <button id="retry" class="ghost" type="button" hidden>Повторить</button>
      </form>
      <p class="hint">Адрес даёт тот, кто запустил сервер. Поменять его потом — в меню значка в трее.</p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const params = new URLSearchParams(location.search)
      const api = window.nuntiusDesktop
      $('url').value = params.get('url') || ''
      if (params.get('error')) {
        $('error').textContent = params.get('error')
        $('lead').textContent = 'Сервер сейчас недоступен'
        $('retry').hidden = false
      }
      $('retry').onclick = () => api.retry()
      $('form').onsubmit = async (e) => {
        e.preventDefault()
        $('go').disabled = true
        $('go').textContent = 'Подключаемся…'
        $('error').textContent = ''
        const res = await api.saveServer($('url').value)
        if (res && res.error) {
          $('error').textContent = res.error
          $('go').disabled = false
          $('go').textContent = 'Подключиться'
        }
      }
    </script>
  </body>
</html>
